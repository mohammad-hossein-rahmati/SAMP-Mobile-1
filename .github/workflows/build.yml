name: Build APK

on:
  push:
    branches: [ patch-1 ] # نام برنچ خود را در صورت نیاز تغییر دهید
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Build Dependencies
        run: |
          # نصب ninja-build که برای کامپایل C++ در برخی پروژه‌ها ضروری است
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Gradle Cache (اختیاری اما توصیه‌شده)
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
#test
