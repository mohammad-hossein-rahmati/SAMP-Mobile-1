name: Build APK

on:
  push:
    branches: [ patch-1 ] # اگر اسم برنچت چیز دیگه‌ایه، اینجا عوضش کن
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          # پذیرش خودکار تمام لایسنس‌ها
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # نصب نسخه دقیق NDK و CMake مورد نیاز پروژه
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
